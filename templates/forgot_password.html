{% extends 'base.html' %}

{% block title %}Forgot Password | Sachin Workflow Manager{% endblock %}

{% block content %}
<main class="min-h-screen grid place-items-center px-4">
	<section class="w-full max-w-md panel p-8 shadow-2xl backdrop-blur relative overflow-hidden">
		<div class="text-center mb-7">
			<div class="mx-auto mb-4 grid place-items-center h-14 w-14 rounded-xl bg-cyan-500/20 text-cyan-300 text-2xl">
				<i class="fa-solid fa-key"></i>
			</div>
			<h1 class="panel-title text-2xl mb-1">Reset Password</h1>
			<p class="text-slate-400 text-sm mt-2">Enter your email and set a new password for your account.</p>
		</div>

		<form id="passwordForm" class="space-y-4">
			<div>
				<label for="email" class="block text-sm font-medium mb-1">Email</label>
				<input id="email" type="email" autocomplete="email" class="w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-cyan-500" required />
			</div>
			<div>
				<label for="newPassword" class="block text-sm font-medium mb-1">New Password</label>
				<input id="newPassword" type="password" minlength="6" class="w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-cyan-500" required />
			</div>
			<div>
				<label for="confirmPassword" class="block text-sm font-medium mb-1">Confirm Password</label>
				<input id="confirmPassword" type="password" minlength="6" class="w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-cyan-500" required />
			</div>
			<button type="submit" class="w-full btn btn-primary py-2.5 transition">
				Set New Password
			</button>
			<p id="resetMsg" class="text-sm hidden"></p>
		</form>

		<div class="mt-6 flex items-center justify-between text-sm">
			<a href="/login" class="text-cyan-300 hover:text-cyan-200 transition">
				<i class="fa-solid fa-arrow-left mr-1"></i>Back to Login
			</a>
		</div>
	</section>
</main>
{% endblock %}

{% block scripts %}
<script>
	const form = document.getElementById('passwordForm');
	const emailEl = document.getElementById('email');
	const newPasswordEl = document.getElementById('newPassword');
	const confirmPasswordEl = document.getElementById('confirmPassword');
	const msgEl = document.getElementById('resetMsg');
	const prefillEmail = {{ prefill_email|tojson }};

	if (prefillEmail) {
		emailEl.value = prefillEmail;
	}

	function showMessage(message, kind = 'ok') {
		msgEl.textContent = message;
		msgEl.classList.remove('hidden', 'text-emerald-400', 'text-rose-400');
		msgEl.classList.add(kind === 'error' ? 'text-rose-400' : 'text-emerald-400');
	}

	form.addEventListener('submit', async (e) => {
		e.preventDefault();
		msgEl.classList.add('hidden');

		const email = emailEl.value.trim();
		const newPassword = newPasswordEl.value.trim();
		const confirmPassword = confirmPasswordEl.value.trim();

		if (!email) {
			showMessage('Email is required', 'error');
			return;
		}

		if (newPassword.length < 6) {
			showMessage('Password must be at least 6 characters', 'error');
			return;
		}

		if (newPassword !== confirmPassword) {
			showMessage('Passwords do not match', 'error');
			return;
		}

		try {
			const res = await fetch('/forgot-password', {
				method: 'POST',
				headers: { 'Content-Type': 'application/json' },
				body: JSON.stringify({ email, new_password: newPassword, confirm_password: confirmPassword }),
			});
			const data = await res.json();
			if (!res.ok) {
				throw new Error(data.error || 'Failed to reset password');
			}

			emailEl.value = '';
			newPasswordEl.value = '';
			confirmPasswordEl.value = '';
			showMessage('Password reset successfully');
			setTimeout(() => {
				window.location.href = '/login';
			}, 800);
		} catch (err) {
			showMessage(err.message, 'error');
		}
	});
</script>
{% endblock %}
