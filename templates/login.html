{% extends 'base.html' %}

{% block title %}Login | Sachin Workflow Manager{% endblock %}

{% block content %}
<main class="min-h-screen grid place-items-center px-4">
    <section class="w-full max-w-md panel p-8 shadow-2xl backdrop-blur relative overflow-hidden">
        <div class="spacex-auth-header mb-6">
            <div class="min-w-0 text-left">
                <div class="spacex-auth-kicker">Access</div>
                <h1 class="spacex-auth-title">Workflow Manager</h1>
                <p class="spacex-auth-subtitle">Sign in to manage your daily and long-term workflows.</p>
            </div>
        </div>

        <form id="loginForm" class="space-y-4">
            <div>
                <label for="email" class="block text-sm font-medium mb-1">Email</label>
                <input id="email" name="email" type="email" placeholder="sachin@example.com" class="w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-cyan-500" required />
            </div>
            <div>
                <label for="password" class="block text-sm font-medium mb-1">Password</label>
                <input id="password" name="password" type="password" class="w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-cyan-500" required />
            </div>
            <button type="submit" class="w-full btn btn-primary py-2.5 transition">
                <i class="fa-solid fa-right-to-bracket mr-2"></i>Login
            </button>
            <p id="loginError" class="text-rose-400 text-sm hidden"></p>
        </form>

        <p class="text-xs text-slate-500 mt-6 text-center">Use your registered email and password.</p>
    </section>
</main>
{% endblock %}

{% block scripts %}
<script>
    const form = document.getElementById('loginForm');
    const errorEl = document.getElementById('loginError');
    const submitBtn = form.querySelector('button[type="submit"]');

    function closeLoginPage(message) {
        errorEl.textContent = message || 'Login closed after too many failed attempts.';
        errorEl.classList.remove('hidden');
        form.querySelectorAll('input, button').forEach((el) => {
            el.disabled = true;
        });

        try {
            window.close();
        } catch (_err) {}

        setTimeout(() => {
            if (!window.closed) {
                window.location.replace('about:blank');
            }
        }, 250);
    }

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorEl.classList.add('hidden');

        const payload = {
            email: form.email.value.trim(),
            password: form.password.value
        };

        try {
            const res = await fetch('/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const data = await res.json();

            if (res.status === 423) {
                closeLoginPage(data.error || 'Login closed after 2 failed attempts');
                return;
            }

            if (!res.ok) {
                throw new Error(data.error || 'Login failed');
            }
            window.location.href = '/home';
        } catch (err) {
            if (String(err.message || '').includes('Login closed after 2 failed attempts')) {
                closeLoginPage(err.message);
                return;
            }
            errorEl.textContent = err.message;
            errorEl.classList.remove('hidden');
        }
    });
</script>
{% endblock %}
