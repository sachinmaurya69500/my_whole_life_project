{% extends 'base.html' %}

{% block title %}Notes - {{ app_name }}{% endblock %}

{% block content %}
<div class="p-6 max-w-6xl mx-auto">
    <header class="flex items-center justify-between mb-6">
        <h2 class="text-2xl font-bold">Notes</h2>
        <div class="flex gap-2">
            <button id="newNoteBtn" class="rounded-lg bg-cyan-500 text-slate-950 px-3 py-2 font-semibold">New Note</button>
            <button id="toggleEditorBtn" class="rounded-lg border border-slate-700 px-3 py-2">Toggle Preview</button>
        </div>
    </header>

    <div class="grid md:grid-cols-3 gap-6">
        <aside class="space-y-3">
            <div id="notesList" class="space-y-2"></div>
        </aside>

        <main class="md:col-span-2">
            <div id="noteEditor" class="panel p-4">
                <form id="noteForm">
                    <input type="hidden" id="noteId" />
                    <div>
                        <input id="noteTitle" placeholder="Title" class="w-full rounded-lg border border-slate-700 px-3 py-2 mb-2 text-lg" />
                    </div>
                    <div class="mb-3">
                        <input id="noteTags" placeholder="Tags (comma separated)" class="w-full rounded-lg border border-slate-700 px-3 py-2" />
                    </div>
                    <div class="grid md:grid-cols-2 gap-3">
                        <input id="noteFolder" placeholder="Folder" class="rounded-lg border border-slate-700 px-3 py-2" />
                        <input id="attachFileInput" type="file" class="rounded-lg" />
                    </div>
                    <div class="mt-3">
                        <textarea id="noteContent" rows="12" class="w-full rounded-lg border border-slate-700 px-3 py-2 font-mono" placeholder="Write markdown here..."></textarea>
                    </div>

                            <div id="templateEditor" class="mt-3 panel p-3 hidden">
                                <h4 class="font-semibold">Create Template</h4>
                                <input id="templateName" placeholder="Template name" class="w-full rounded-lg border border-slate-700 px-3 py-2 mt-2" />
                                <textarea id="templateContent" rows="6" class="w-full rounded-lg border border-slate-700 px-3 py-2 mt-2" placeholder="Template markdown..."></textarea>
                                <div class="flex justify-end gap-2 mt-2"><button id="saveTemplateBtn" type="button" class="rounded-lg bg-cyan-500 text-slate-950 px-3 py-2">Save Template</button></div>
                            </div>
                    <div class="flex justify-end gap-2 mt-3">
                        <button id="cancelNoteBtn" type="button" class="rounded-lg border border-slate-700 px-3 py-2">Cancel</button>
                        <button type="submit" class="rounded-lg bg-cyan-500 text-slate-950 px-3 py-2">Save Note</button>
                    </div>
                </form>
            </div>

            <div id="notePreview" class="panel p-4 mt-4 hidden">
                <h3 id="previewTitle" class="text-xl font-semibold"></h3>
                <div id="previewContent" class="prose max-w-none text-slate-200 mt-2"></div>
                <div id="attachmentsArea" class="mt-3 text-sm text-slate-400"></div>
            </div>
        </main>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/notes.js') }}"></script>
{% endblock %}
