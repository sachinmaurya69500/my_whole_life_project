{% extends 'base.html' %}

{% block title %}Travel & Expenses - {{ app_name }}{% endblock %}

{% block content %}
<main class="min-h-screen p-4 md:p-8">
    <div class="max-w-4xl mx-auto space-y-6">
        <header class="spacex-page-header">
            <div class="min-w-0">
                <div class="spacex-page-kicker">Mission Ledger</div>
                <h2 class="spacex-page-title">Travel & Expenses</h2>
                <p class="spacex-page-subtitle">Track travel costs and spend like a mission budget, not a cluttered spreadsheet.</p>
            </div>
            <div class="spacex-header-actions">
                <button id="newExpenseBtn" type="button" class="btn btn-primary">Add Expense</button>
            </div>
        </header>

        <div id="expensesList" class="space-y-3"></div>
    </div>
</main>

<div id="expenseModal" class="fixed inset-0 z-50 hidden" aria-hidden="true">
    <div id="expenseBackdrop" class="absolute inset-0 bg-black/70"></div>
    <div class="relative min-h-screen grid place-items-center p-4">
        <div class="w-full max-w-3xl panel border-slate-700 max-h-[calc(100vh-2rem)] overflow-y-auto shadow-2xl">
            <div class="flex items-center justify-between mb-6 p-4 pb-0">
                <h3 class="panel-title !mb-0" id="expenseModalTitle">Add Expense</h3>
                <button id="closeExpenseModalBtn" type="button" class="h-9 w-9 rounded-lg border border-slate-700 hover:bg-slate-800 transition" aria-label="Close expense dialog">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <form id="expenseForm" class="space-y-3 p-4 pt-0">
                <input type="hidden" id="expenseId" />
                <div>
                    <label class="block text-sm mb-1">Date</label>
                    <input id="expenseDate" aria-label="Expense date" type="date" class="rounded-lg border border-slate-700 px-3 py-2 w-full" />
                </div>
                <div class="grid md:grid-cols-3 gap-3">
                    <input id="expenseType" aria-label="Expense type" class="rounded-lg border border-slate-700 px-3 py-2" placeholder="Transport, Hotel, Meal" />
                    <input id="expenseAmount" aria-label="Expense amount" class="rounded-lg border border-slate-700 px-3 py-2" placeholder="Amount" />
                    <input id="expenseCurrency" aria-label="Expense currency" class="rounded-lg border border-slate-700 px-3 py-2" placeholder="Currency" value="USD" />
                </div>
                <div>
                    <label class="block text-sm mb-1">Vendor</label>
                    <input id="expenseVendor" aria-label="Expense vendor" class="w-full rounded-lg border border-slate-700 px-3 py-2" />
                </div>
                <div>
                    <label class="block text-sm mb-1">Notes</label>
                    <textarea id="expenseNotes" aria-label="Expense notes" rows="3" class="w-full rounded-lg border border-slate-700 px-3 py-2"></textarea>
                </div>
                <div class="flex gap-3 justify-end">
                    <button id="cancelExpenseBtn" type="button" class="btn btn-secondary">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Expense</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/travel.js') }}"></script>
{% endblock %}
