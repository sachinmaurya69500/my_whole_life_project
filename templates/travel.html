{% extends 'base.html' %}

{% block title %}Travel & Expenses - {{ app_name }}{% endblock %}

{% block content %}
<main class="min-h-screen p-4 md:p-8">
    <div class="max-w-4xl mx-auto space-y-6">
        <header class="flex flex-wrap items-center justify-between gap-3 panel">
            <div>
                <p class="text-xs uppercase tracking-[0.25em] text-slate-400">Jarvis Ledger</p>
                <h2 class="panel-title text-2xl mb-0">Travel & Expenses</h2>
            </div>
            <button id="newExpenseBtn" class="btn btn-primary">Add Expense</button>
        </header>

        <div id="expensesList" class="space-y-3"></div>

        <div id="expenseFormWrap" class="hidden panel mt-6">
            <form id="expenseForm" class="space-y-3 p-4">
                <input type="hidden" id="expenseId" />
                <div>
                    <label class="block text-sm mb-1">Date</label>
                    <input id="expenseDate" aria-label="Expense date" type="date" class="rounded-lg border border-slate-700 px-3 py-2" />
                </div>
                <div class="grid md:grid-cols-3 gap-3">
                    <input id="expenseType" aria-label="Expense type" class="rounded-lg border border-slate-700 px-3 py-2" placeholder="Transport, Hotel, Meal" />
                    <input id="expenseAmount" aria-label="Expense amount" class="rounded-lg border border-slate-700 px-3 py-2" placeholder="Amount" />
                    <input id="expenseCurrency" aria-label="Expense currency" class="rounded-lg border border-slate-700 px-3 py-2" placeholder="Currency" value="USD" />
                </div>
                <div>
                    <label class="block text-sm mb-1">Vendor</label>
                    <input id="expenseVendor" aria-label="Expense vendor" class="w-full rounded-lg border border-slate-700 px-3 py-2" />
                </div>
                <div>
                    <label class="block text-sm mb-1">Notes</label>
                    <textarea id="expenseNotes" aria-label="Expense notes" rows="3" class="w-full rounded-lg border border-slate-700 px-3 py-2"></textarea>
                </div>
                <div class="flex gap-3 justify-end">
                    <button id="cancelExpenseBtn" type="button" class="btn btn-secondary">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Expense</button>
                </div>
            </form>
        </div>
    </div>
</main>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/travel.js') }}"></script>
{% endblock %}
