{% extends 'base.html' %}

{% block title %}Reminders - {{ app_name }}{% endblock %}

{% block content %}
<main class="min-h-screen p-4 md:p-8">
    <div class="max-w-4xl mx-auto space-y-6">
        <header class="spacex-page-header">
            <div class="min-w-0">
                <div class="spacex-page-kicker">Mission Alerts</div>
                <h2 class="spacex-page-title">Reminders</h2>
                <p class="spacex-page-subtitle">Keep deadlines and follow-ups visible with a clean mission-alert hierarchy.</p>
            </div>
            <div class="spacex-header-actions">
                <button id="newReminderBtn" class="btn btn-primary">New Reminder</button>
            </div>
        </header>

        <div id="remindersList" class="space-y-3"></div>

        <div id="reminderFormWrap" class="hidden panel mt-6">
            <form id="reminderForm" class="space-y-3 p-4">
                <input type="hidden" id="reminderId" />
                <div>
                    <label class="block text-sm mb-1">Title</label>
                    <input id="reminderTitle" aria-label="Reminder title" class="w-full rounded-lg border border-slate-700 px-3 py-2" required />
                </div>
                <div>
                    <label class="block text-sm mb-1">Message</label>
                    <textarea id="reminderMessage" aria-label="Reminder message" rows="3" class="w-full rounded-lg border border-slate-700 px-3 py-2"></textarea>
                </div>
                <div class="grid md:grid-cols-2 gap-3">
                    <input id="reminderDue" aria-label="Reminder due date and time" type="datetime-local" class="rounded-lg border border-slate-700 px-3 py-2" />
                    <input id="reminderRepeat" aria-label="Reminder repeat minutes" type="number" class="rounded-lg border border-slate-700 px-3 py-2" placeholder="Repeat minutes (optional)" />
                </div>
                <div class="flex gap-3 justify-end">
                    <button id="cancelReminderBtn" type="button" class="btn btn-secondary">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Reminder</button>
                </div>
            </form>
        </div>
    </div>
</main>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/reminders.js') }}"></script>
{% endblock %}
