<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Sachin Workflow Manager{% endblock %}</title>
    <script src="{{ url_for('static', filename='js/tailwind-cdn.js') }}"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            500: '#22d3ee',
                            600: '#0891b2'
                        }
                    }
                }
            }
        };
    </script>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}" />
    <script>
        (function () {
            const savedTheme = localStorage.getItem('swm-theme');
            const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            const initialTheme = savedTheme || (prefersDark ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', initialTheme);
        })();
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
    {% block head_extras %}{% endblock %}
</head>
<body class="min-h-screen">
    <button id="themeToggle" class="theme-toggle" type="button" aria-label="Toggle theme" title="Toggle light/dark theme">
        <i class="fa-solid fa-moon"></i>
    </button>
    {% block content %}{% endblock %}

    <button
        id="assistantLauncher"
        class="assistant-launcher"
        type="button"
        aria-label="Open Gemini Assistant"
        aria-expanded="false"
        title="Open Gemini Assistant"
    >
        <span class="assistant-launcher-core" aria-hidden="true">
            <span class="assistant-orbit orbit-one"></span>
            <span class="assistant-orbit orbit-two"></span>
            <i class="fa-solid fa-robot"></i>
        </span>
    </button>

    <section id="assistantPanel" class="assistant-panel hidden" aria-label="Gemini Assistant" aria-hidden="true">
        <header class="assistant-panel-header">
            <div>
                <h3>Gemini Assistant</h3>
                <p>AI help for your workflow</p>
                <div id="assistantApiStatus" class="assistant-api-status checking" aria-live="polite">Checking API...</div>
            </div>
            <div class="assistant-header-actions">
                <button type="button" id="newChatBtn" class="assistant-header-btn" aria-label="Start new chat" title="Start new conversation">
                    <i class="fa-solid fa-plus"></i>
                </button>
                <button id="assistantClose" type="button" class="assistant-close" aria-label="Close assistant">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
        </header>

        <!-- Tab Navigation -->
        <div class="assistant-tabs">
            <button type="button" class="assistant-tab active" data-tab="chat" aria-label="Chat with assistant">
                <i class="fa-solid fa-comments"></i> Chat
            </button>
            <button type="button" class="assistant-tab" data-tab="history" aria-label="View chat history">
                <i class="fa-solid fa-clock"></i> History
            </button>
            <button type="button" class="assistant-tab" data-tab="add-project" aria-label="Add new project">
                <i class="fa-solid fa-plus"></i> New Project
            </button>
            <button type="button" class="assistant-tab" data-tab="edit-project" aria-label="Edit existing project">
                <i class="fa-solid fa-pen"></i> Edit Project
            </button>
            <button type="button" class="assistant-tab" data-tab="advice" aria-label="Manage project advice">
                <i class="fa-solid fa-lightbulb"></i> Advice
            </button>
        </div>

        <!-- Chat Tab -->
        <div id="chatTab" class="assistant-tab-content active">
            <div id="assistantMessages" class="assistant-messages"></div>
            <form id="assistantForm" class="assistant-form">
                <input id="assistantInput" type="text" maxlength="1500" aria-label="Assistant message input" placeholder="Ask Gemini to prioritize, plan, or unblock your next step..." />
                <button id="assistantSend" type="submit">Send</button>
            </form>
        </div>

        <!-- History Tab -->
        <div id="historyTab" class="assistant-tab-content">
            <div class="history-container">
                <div id="historyList" class="history-list"></div>
                <button type="button" id="clearHistoryBtn" class="project-form-btn delete" style="margin-top: 1rem;">
                    <i class="fa-solid fa-trash"></i> Clear All History
                </button>
            </div>
        </div>

        <!-- Add Project Tab -->
        <div id="addProjectTab" class="assistant-tab-content">
            <form id="addProjectForm" class="project-form">
                <label>Project Title <span class="required">*</span>
                    <input type="text" id="projectTitle" required maxlength="100" placeholder="e.g., Project on English" aria-label="Project title" />
                </label>
                <label>Type <span class="required">*</span>
                    <select id="projectType" required aria-label="Project type">
                        <option value="Daily">Daily</option>
                        <option value="Long-term">Long-term</option>
                    </select>
                </label>
                <label>Description
                    <textarea id="projectDescription" maxlength="300" placeholder="What is this project about?" rows="2" aria-label="Project description"></textarea>
                </label>
                <label>Status
                    <select id="projectStatus" aria-label="Project status">
                        <option value="Not Started">Not Started</option>
                        <option value="In Progress">In Progress</option>
                        <option value="Completed">Completed</option>
                    </select>
                </label>
                <label>Progress (%)
                    <input type="number" id="projectProgress" min="0" max="100" value="0" aria-label="Project progress percentage" />
                </label>
                <label>Start Date
                    <input type="date" id="projectStartDate" aria-label="Project start date" />
                </label>
                <label>Due Date
                    <input type="date" id="projectDueDate" aria-label="Project due date" />
                </label>
                <label>Notes
                    <textarea id="projectNotes" maxlength="300" placeholder="Additional notes..." rows="2" aria-label="Project notes"></textarea>
                </label>
                <button type="submit" class="project-form-btn">Create Project</button>
                <div id="addProjectMessage" class="project-message"></div>
            </form>
        </div>

        <!-- Edit Project Tab -->
        <div id="editProjectTab" class="assistant-tab-content">
            <form id="editProjectForm" class="project-form">
                <label>Select Project <span class="required">*</span>
                    <select id="editProjectSelect" required aria-label="Select project to edit">
                        <option value="">Loading projects...</option>
                    </select>
                </label>
                <label>Title <span class="required">*</span>
                    <input type="text" id="editProjectTitle" required maxlength="100" aria-label="Project title" />
                </label>
                <label>Type <span class="required">*</span>
                    <select id="editProjectType" required aria-label="Project type">
                        <option value="Daily">Daily</option>
                        <option value="Long-term">Long-term</option>
                    </select>
                </label>
                <label>Description
                    <textarea id="editProjectDescription" maxlength="300" rows="2" aria-label="Project description"></textarea>
                </label>
                <label>Status
                    <select id="editProjectStatus" aria-label="Project status">
                        <option value="Not Started">Not Started</option>
                        <option value="In Progress">In Progress</option>
                        <option value="Completed">Completed</option>
                    </select>
                </label>
                <label>Progress (%)
                    <input type="number" id="editProjectProgress" min="0" max="100" value="0" aria-label="Project progress percentage" />
                </label>
                <label>Start Date
                    <input type="date" id="editProjectStartDate" aria-label="Project start date" />
                </label>
                <label>Due Date
                    <input type="date" id="editProjectDueDate" aria-label="Project due date" />
                </label>
                <label>Notes
                    <textarea id="editProjectNotes" maxlength="300" rows="2" aria-label="Project notes"></textarea>
                </label>
                <div class="project-form-buttons">
                    <button type="submit" class="project-form-btn">Update Project</button>
                    <button type="button" id="deleteProjectBtn" class="project-form-btn delete">Delete</button>
                </div>
                <div id="editProjectMessage" class="project-message"></div>
            </form>
        </div>

        <!-- Advice Tab -->
        <div id="adviceTab" class="assistant-tab-content">
            <form id="adviceForm" class="project-form">
                <label>Select Project <span class="required">*</span>
                    <select id="adviceProjectSelect" required aria-label="Select project to add advice">
                        <option value="">Loading projects...</option>
                    </select>
                </label>
                <label>Your Advice (💡 This will help the assistant give better suggestions)
                    <textarea id="adviceText" maxlength="500" placeholder="e.g., I work best in the morning. Breaking this into smaller daily tasks helps. Focus on quality over quantity." rows="3" aria-label="Advice for this project"></textarea>
                </label>
                <button type="submit" class="project-form-btn">Save Advice</button>
                <div id="adviceMessage" class="project-message"></div>
            </form>
        </div>
    </section>

    {% block scripts %}{% endblock %}
    <script src="{{ url_for('static', filename='js/assistant-widget.js') }}"></script>
    <script>
        (function () {
            const themeToggle = document.getElementById('themeToggle');
            if (!themeToggle) return;

            const icon = themeToggle.querySelector('i');

            function updateThemeIcon(theme) {
                if (!icon) return;
                icon.className = theme === 'dark' ? 'fa-solid fa-moon' : 'fa-solid fa-sun';
            }

            function getTheme() {
                return document.documentElement.getAttribute('data-theme') || 'dark';
            }

            updateThemeIcon(getTheme());

            themeToggle.addEventListener('click', () => {
                const nextTheme = getTheme() === 'dark' ? 'light' : 'dark';
                document.documentElement.setAttribute('data-theme', nextTheme);
                localStorage.setItem('swm-theme', nextTheme);
                updateThemeIcon(nextTheme);
            });
        })();
    </script>
</body>
</html>
