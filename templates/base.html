<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Sachin Workflow Manager{% endblock %}</title>
    <script src="{{ url_for('static', filename='js/tailwind-cdn.js') }}"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            500: '#22d3ee',
                            600: '#0891b2'
                        }
                    }
                }
            }
        };
    </script>
    <link id="appFavicon" rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/profile-placeholder.svg') }}" />
    <script>
        (function () {
            const savedTheme = localStorage.getItem('swm-theme');
            const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            const initialTheme = savedTheme || (prefersDark ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', initialTheme);
        })();

        (async function () {
            const favicon = document.getElementById('appFavicon');
            if (!favicon) return;
            try {
                const res = await fetch('/api/profile', { credentials: 'same-origin' });
                if (!res.ok) return;
                const profile = await res.json();
                if (!profile || !profile.profile_image_url) return;
                const imageVersion = profile.profile_image_updated_at ? encodeURIComponent(profile.profile_image_updated_at) : Date.now();
                favicon.href = `${profile.profile_image_url}?v=${imageVersion}`;
            } catch (_err) {
                // Keep fallback favicon when profile data is unavailable.
            }
        })();
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/static/sw.js').catch(()=>{});
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
    {% block head_extras %}{% endblock %}
</head>
<body class="min-h-screen">
    <button id="themeToggle" class="theme-toggle" type="button" aria-label="Toggle theme" title="Toggle light/dark theme">
        <i class="fa-solid fa-moon"></i>
    </button>
    {% block content %}{% endblock %}

    <button
        id="assistantLauncher"
        class="assistant-launcher"
        type="button"
        aria-label="Open Gemini Assistant"
        aria-expanded="false"
        title="Open Gemini Assistant"
    >
        <span class="assistant-launcher-core" aria-hidden="true">
            <span class="assistant-orbit orbit-one"></span>
            <span class="assistant-orbit orbit-two"></span>
            <i class="fa-solid fa-robot"></i>
        </span>
    </button>

    <!-- Jarvis Fullscreen Assistant Panel (replaces previous assistant UI) -->
    <section id="jarvisPanel" class="jarvis-panel hidden" aria-label="Jarvis Assistant" aria-hidden="true">
        <div class="jarvis-backdrop"></div>
        <div class="jarvis-shell">
            <header class="jarvis-header">
                <div class="jarvis-title">
                    <div class="jarvis-logo"><i class="fa-solid fa-microchip"></i></div>
                    <div>
                        <h2 class="text-glow">JARVIS</h2>
                        <p class="text-scan">Your personal AI assistant — Tactical Interface</p>
                    </div>
                </div>
                <div class="jarvis-actions">
                    <button id="jarvisClose" class="btn btn-secondary" aria-label="Close Jarvis"><i class="fa-solid fa-xmark"></i></button>
                </div>
            </header>

            <main class="jarvis-main">
                <section class="jarvis-holo">
                    <canvas id="jarvisCanvas" width="800" height="300"></canvas>
                </section>

                <section class="jarvis-chat">
                    <div id="jarvisMessages" class="assistant-messages jarvis-messages"></div>
                    <form id="jarvisForm" class="assistant-form jarvis-form">
                        <button id="jarvisVoiceBtn" type="button" class="btn btn-secondary jarvis-voice" title="Voice input (click)">
                            <i class="fa-solid fa-microphone"></i>
                        </button>
                        <input id="jarvisInput" type="text" maxlength="2000" placeholder="Ask JARVIS anything..." aria-label="Jarvis input" />
                        <button id="jarvisSend" type="submit" class="btn btn-primary">Send</button>
                    </form>
                </section>
            </main>

            <footer class="jarvis-footer">
                <div id="jarvisStatus" class="assistant-api-status checking">Checking AI...</div>
                <div class="jarvis-hint text-scan">Type "JARVIS" anytime to activate the theme.</div>
            </footer>
        </div>
    </section>

    {% block scripts %}{% endblock %}
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
    <script src="{{ url_for('static', filename='js/assistant-widget.js') }}"></script>
    <script>
        (function () {
            const themeToggle = document.getElementById('themeToggle');
            if (!themeToggle) return;

            const icon = themeToggle.querySelector('i');

            function updateThemeIcon(theme) {
                if (!icon) return;
                icon.className = theme === 'dark' ? 'fa-solid fa-moon' : 'fa-solid fa-sun';
            }

            function getTheme() {
                return document.documentElement.getAttribute('data-theme') || 'dark';
            }

            updateThemeIcon(getTheme());

            themeToggle.addEventListener('click', () => {
                const nextTheme = getTheme() === 'dark' ? 'light' : 'dark';
                document.documentElement.setAttribute('data-theme', nextTheme);
                localStorage.setItem('swm-theme', nextTheme);
                updateThemeIcon(nextTheme);
            });
        })();
    </script>
</body>
</html>
