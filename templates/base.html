<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Sachin Workflow Manager{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            500: '#22d3ee',
                            600: '#0891b2'
                        }
                    }
                }
            }
        };
    </script>
    <script>
        (function () {
            const savedTheme = localStorage.getItem('swm-theme');
            const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            const initialTheme = savedTheme || (prefersDark ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', initialTheme);
        })();
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
    {% block head_extras %}{% endblock %}
</head>
<body class="min-h-screen">
    <button id="themeToggle" class="theme-toggle" type="button" aria-label="Toggle theme" title="Toggle light/dark theme">
        <i class="fa-solid fa-moon"></i>
    </button>
    {% block content %}{% endblock %}

    <button
        id="assistantLauncher"
        class="assistant-launcher"
        type="button"
        aria-label="Open Gemini Assistant"
        aria-expanded="false"
        title="Open Gemini Assistant"
    >
        <span class="assistant-launcher-core"><i class="fa-solid fa-wand-magic-sparkles"></i></span>
    </button>

    <section id="assistantPanel" class="assistant-panel hidden" aria-label="Gemini Assistant" aria-hidden="true">
        <header class="assistant-panel-header">
            <div>
                <h3>Gemini Assistant</h3>
                <p>Future-focused help for your workflow</p>
            </div>
            <button id="assistantClose" type="button" class="assistant-close" aria-label="Close assistant">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </header>
        <div id="assistantMessages" class="assistant-messages"></div>
        <form id="assistantForm" class="assistant-form">
            <input id="assistantInput" type="text" maxlength="1500" aria-label="Assistant message input" placeholder="Ask Gemini to prioritize, plan, or unblock your next step..." />
            <button id="assistantSend" type="submit">Send</button>
        </form>
    </section>

    {% block scripts %}{% endblock %}
    <script src="{{ url_for('static', filename='js/assistant-widget.js') }}"></script>
    <script>
        (function () {
            const themeToggle = document.getElementById('themeToggle');
            if (!themeToggle) return;

            const icon = themeToggle.querySelector('i');

            function updateThemeIcon(theme) {
                if (!icon) return;
                icon.className = theme === 'dark' ? 'fa-solid fa-moon' : 'fa-solid fa-sun';
            }

            function getTheme() {
                return document.documentElement.getAttribute('data-theme') || 'dark';
            }

            updateThemeIcon(getTheme());

            themeToggle.addEventListener('click', () => {
                const nextTheme = getTheme() === 'dark' ? 'light' : 'dark';
                document.documentElement.setAttribute('data-theme', nextTheme);
                localStorage.setItem('swm-theme', nextTheme);
                updateThemeIcon(nextTheme);
            });
        })();
    </script>
</body>
</html>
