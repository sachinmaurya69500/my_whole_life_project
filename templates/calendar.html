{% extends 'base.html' %}

{% block title %}Calendar - {{ app_name }}{% endblock %}

{% block content %}
<div class="p-6 max-w-4xl mx-auto">
    <header class="flex items-center justify-between mb-6">
        <h2 class="text-2xl font-bold">Calendar</h2>
        <a href="/project/" class="text-sm text-slate-400">Manage events</a>
    </header>

    <div id="eventsList" class="space-y-3"></div>
</div>
{% endblock %}

{% block scripts %}
<script>
(async function(){
    try{
        const res = await fetch('/api/events', {credentials: 'same-origin'});
        const data = await res.json();
        const container = document.getElementById('eventsList');
        if(!Array.isArray(data) || !data.length){
            container.innerHTML = '<p class="text-slate-400">No upcoming events.</p>';
            return;
        }
        container.innerHTML = data.map(e=>`<div class="panel"><div class="flex justify-between"><strong>${e.title}</strong><span>${e.start_at||''}</span></div><p class="text-sm text-slate-400">${e.description||''}</p></div>`).join('');
    }catch(err){
        console.error(err);
    }
})();
</script>
{% endblock %}
